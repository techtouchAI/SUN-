name: Temporary format fixer

# One-off helper: this sandbox cannot download GitHub Actions logs (the Actions
# blob storage host is unreachable from here), so this workflow applies the same
# `dart format` target list as the CI quality job on the PR branch, pushes the
# formatted sources back, and then writes the analyze/test output into
# `ci-diag.txt` and pushes it so it can be read through the repository API.
#
# It is deleted again (together with ci-diag.txt) once CI is green.
on:
  pull_request:
    branches:
      - golden-version
      - main

permissions:
  contents: write

concurrency:
  group: tmp-autofmt-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply dart format
    if: '${{ !startsWith(github.event.head_commit.message, ''chore(ci): publish
      diagnostics'') }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply dart format
        run: |
          dart format \
            lib/core \
            lib/logic/providers.dart \
            lib/models \
            lib/repositories \
            lib/services \
            test

      - name: Analyze
        run: |
          flutter analyze > /tmp/analyze.txt 2>&1
          echo "analyze_exit=$?" >> /tmp/analyze.txt
          cat /tmp/analyze.txt
          grep -q '^analyze_exit=0$' /tmp/analyze.txt

      - name: Test
        run: |
          flutter test > /tmp/test.txt 2>&1
          echo "test_exit=$?" >> /tmp/test.txt
          tail -n 150 /tmp/test.txt
          grep -q '^test_exit=0$' /tmp/test.txt

      - name: Publish diagnostics and formatting
        if: always()
        run: |
          set -euo pipefail
          {
            echo "=== HEAD: $(git rev-parse HEAD) ==="
            echo "=== dart format ==="
            git diff --stat || true
            echo
            echo "=== flutter analyze ==="
            cat /tmp/analyze.txt 2>/dev/null || echo "(analyze step did not run)"
            echo
            echo "=== flutter test (tail 200) ==="
            tail -n 200 /tmp/test.txt 2>/dev/null || echo "(test step did not run)"
          } > ci-diag.txt
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "chore(ci): publish diagnostics and formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
