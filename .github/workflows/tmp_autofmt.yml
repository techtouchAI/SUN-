name: Temporary format fixer

# One-off helper: this sandbox cannot download GitHub Actions logs (the Actions
# blob storage host is unreachable from here), so this workflow applies the same
# `dart format` target list as the CI quality job on the PR branch, pushes the
# formatted sources back, and then surfaces analyze/test failures as check
# annotations that can be read through the API.
#
# It is deleted again once the formatting has been applied and CI is green.
on:
  pull_request:
    branches:
      - golden-version
      - main

permissions:
  contents: write

concurrency:
  group: tmp-autofmt-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply dart format
    if: '${{ !startsWith(github.event.head_commit.message, ''style: apply dart
      format'') }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: List files that need formatting
        run: |
          set -uo pipefail
          targets="lib/core lib/logic/providers.dart lib/models lib/repositories lib/services test"
          dart format --output=none --set-exit-if-changed $targets > /tmp/fmt.txt 2>&1 || true
          grep -E '^(Changed|Formatted) ' /tmp/fmt.txt | while IFS= read -r line; do
            printf '::notice::%s\n' "$line"
          done
          tail -n 5 /tmp/fmt.txt | while IFS= read -r line; do
            printf '::notice::fmt-tail %s\n' "$line"
          done

      - name: Apply dart format
        run: |
          dart format \
            lib/core \
            lib/logic/providers.dart \
            lib/models \
            lib/repositories \
            lib/services \
            test

      - name: Push formatted sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git diff --stat
          git diff --stat | while IFS= read -r line; do
            printf '::notice::diffstat %s\n' "$line"
          done
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A
          git commit -m "style: apply dart format to backend and tests"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          set -uo pipefail
          flutter test 2>&1 | tee /tmp/test.txt
          status=${PIPESTATUS[0]}
          grep -nE '\[E\]|Expected:|Actual:|Some tests failed|Failed to load' /tmp/test.txt \
            | head -n 40 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          exit "$status"
