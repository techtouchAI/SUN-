name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Flutter version in the form 1.0.19+569. Leave empty to use pubspec.yaml.'
        required: false
        type: string
      release_message:
        description: 'User-facing OTA release message.'
        required: false
        type: string

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    env:
      MIN_SUPPORTED_ANDROID_VERSION_CODE: '2569'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply requested OTA version
        if: ${{ inputs.release_version != '' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo 'release_version must use the form 1.0.19+569.' >&2
            exit 1
          }
          build_number="${version##*+}"
          (( build_number >= MIN_SUPPORTED_ANDROID_VERSION_CODE )) || {
            echo "Android build number must be at least ${MIN_SUPPORTED_ANDROID_VERSION_CODE} for in-place updates." >&2
            exit 1
          }
          sed -i "s/^version: .*/version: ${version}/" pubspec.yaml

      - name: Prepare OTA release message
        shell: bash
        env:
          RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail
          metadata_version="$(jq -r '.version // empty' ota_release.json)"
          metadata_message="$(jq -r '.message // empty' ota_release.json)"
          current_version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          test "$metadata_version" = "$current_version" || {
            echo 'ota_release.json version must match pubspec.yaml.' >&2
            exit 1
          }
          if [ -n "$RELEASE_MESSAGE" ] && [ "$RELEASE_MESSAGE" != "$metadata_message" ]; then
            echo 'release_message must match ota_release.json.' >&2
            exit 1
          fi
          message="$metadata_message"
          test -n "$message" || message='تحديث إصدار SUN.'
          printf '%s\n' "$message" > build-release-notes.md

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/core \
            lib/logic/providers.dart \
            lib/models \
            lib/repositories \
            lib/services/update_service.dart \
            lib/services/update_service_native.dart \
            lib/services/update_service_stub.dart \
            lib/services/version_comparator.dart \
            test
          flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'KEYSTORE_BASE64 is required for a production release'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'STORE_PASSWORD is required for a production release'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'KEY_PASSWORD is required for a production release'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'KEY_ALIAS is required for a production release'; exit 1; }

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties

      - name: Build universal APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Normalize release asset names
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sun-universal-release.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/sun-release.aab

      - name: Create artifact checksums
        run: sha256sum build/app/outputs/flutter-apk/sun-universal-release.apk build/app/outputs/bundle/release/sun-release.aab > build/SHA256SUMS.txt

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          test -n "$version"
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sun-release-artifacts
          path: |
            build/app/outputs/flutter-apk/sun-universal-release.apk
            build/app/outputs/bundle/release/sun-release.aab
            build/SHA256SUMS.txt
            build-release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sun-release-artifacts
          path: dist

      - name: Remove stale Android release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          release_error="$(mktemp)"
          trap 'rm -f "$release_json" "$release_error"' EXIT
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json" 2> "$release_error"; then
            while IFS= read -r asset_id; do
              test -n "$asset_id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(jq -r '.assets[] | select(.name | test("\\.(apk|aab)$|^SHA256SUMS\\.txt$")) | .id' "$release_json")
          elif grep -qE 'HTTP 404|Not Found' "$release_error"; then
            echo "Release ${RELEASE_TAG} does not exist yet; no stale assets to remove."
          else
            cat "$release_error" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          files: dist/**
          body_path: dist/build-release-notes.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
