name: Flutter Release

on:
  push:
    branches:
      - golden-version
  workflow_dispatch:

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'KEYSTORE_BASE64 is required for a production release'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'STORE_PASSWORD is required for a production release'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'KEY_PASSWORD is required for a production release'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'KEY_ALIAS is required for a production release'; exit 1; }

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties

      - name: Build split APKs
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Create artifact checksums
        run: |
          find build/app/outputs/flutter-apk build/app/outputs/bundle/release -type f \
            \( -name '*.apk' -o -name '*.aab' \) -print0 \
            | xargs -0 sha256sum > build/SHA256SUMS.txt

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          test -n "$version"
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sun-release-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sun-release-artifacts
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          files: dist/**
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
