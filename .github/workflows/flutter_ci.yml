name: Flutter CI

on:
  pull_request:
    branches:
      - golden-version
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check backend and test formatting
        run: dart format --output=none --set-exit-if-changed lib/core lib/logic/providers.dart lib/models lib/repositories lib/services test

      - name: Analyze
        run: flutter analyze

      - name: Test
        id: tests
        run: flutter test --coverage --file-reporter "json:$RUNNER_TEMP/flutter-test-results.jsonl"

      - name: Annotate failed tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / 'flutter-test-results.jsonl'
          if not report.exists():
              print('::error::Flutter failed before creating its test report; see the Test step log.')
              raise SystemExit(0)
          names = {}
          messages = defaultdict(list)
          failed = set()
          for line in report.read_text().splitlines():
              event = json.loads(line)
              kind = event.get('type')
              test_id = event.get('testID')
              if kind == 'testStart':
                  names[event['test']['id']] = event['test']['name']
              elif kind == 'print':
                  messages[test_id].append(event['message'])
              elif kind == 'error':
                  failed.add(test_id)
                  messages[test_id].append(event['error'])
                  messages[test_id].append(event.get('stackTrace', ''))
              elif kind == 'testDone' and event.get('result') in ('error', 'failure'):
                  failed.add(test_id)
          for test_id in sorted(failed):
              detail = names.get(test_id, 'Flutter test') + '\n' + '\n'.join(messages[test_id])
              detail = detail[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter test failed::{detail}')
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - web
          - apk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.target == 'apk'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Build Android debug APK
        if: matrix.target == 'apk'
        run: flutter build apk --debug
